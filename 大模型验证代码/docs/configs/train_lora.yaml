### 高光谱质检 Qwen LoRA 微调配置
### 使用方式: llamafactory-cli train docs/configs/train_lora.yaml

model_name_or_path: Qwen/Qwen2.5-7B-Instruct

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all

dataset: spectrum_classify
template: qwen
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 4

output_dir: saves/spectrum-qwen-lora
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true

val_size: 0.1
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 200
